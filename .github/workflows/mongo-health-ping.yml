# Bi-weekly MongoDB Atlas ping + EmailJS status mail.
# 1st and 15th of each month at 08:00 UTC (1:30 PM IST).
#
# GitHub → Settings → Secrets and variables → Actions:
#   MONGO_URI
#   EMAILJS_SERVICE_ID
#   EMAILJS_TEMPLATE_ID
#   EMAILJS_PUBLIC_KEY
#   EMAILJS_PRIVATE_KEY
#
# Atlas Network Access must allow 0.0.0.0/0 (or GitHub Actions IPs).

name: Mongo health ping

on:
  schedule:
    - cron: "0 8 1,15 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install mongodb driver
        run: npm install mongodb@6
      - name: Ping Mongo and email status
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          EMAIL_TO: parthivshah293@gmail.com
        run: node scripts/mongo-health-ping.mjs
