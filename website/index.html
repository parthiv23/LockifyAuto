<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumora — Private by Design</title>
    <meta name="description" content="Lumora is a password manager with an encrypted vault, recovery key, and biometric unlock. Open the app to store logins securely." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Lumora — Private by Design" />
    <meta property="og:description" content="Lumora is a password manager with an encrypted vault, recovery key, and biometric unlock." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumora — Private by Design" />

    <meta name="twitter:image" content="/og.png" />
    <meta name="theme-color" content="#f4f6ee" />
    <script>
      try {
        var t = localStorage.getItem("lumora.theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />

    <div id="root"></div>

  </body>
